name: Tinycast
options:
  bundleIdPrefix: com.tinycast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Stable self-signed identity so macOS keeps the Accessibility grant across rebuilds.
    # Create it once — see docs/signing.md.
    CODE_SIGN_IDENTITY: "Tinycast Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
    TINYCAST_BUNDLE_IDENTIFIER: com.tinycast.app
  configs:
    Debug:
      TINYCAST_BUNDLE_IDENTIFIER: com.tinycast.app.dev
    Release:
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
        # The helper's own sources: compiling them in would link Vision and PDFKit into the app,
        # which is the whole thing running recognition out of process avoids.
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
          - Features/KeyRemap/Helper
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Tinycast/Resources/EmojiKeywords
        type: folder
      # Rooms' MIT licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: TinycastKeyboardHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # SMAppService only registers a daemon whose plist ships inside the bundle; the label and
    # Mach service are per channel, so Tinycast Dev runs a helper of its own. No KeepAlive:
    # launchd starts the helper on Tinycast's first message, and it exits once idle.
    postBuildScripts:
      - name: Keyboard Helper LaunchDaemon
        script: |
          set -eu
          label="${PRODUCT_BUNDLE_IDENTIFIER}.keyboard-helper"
          plist="${SCRIPT_OUTPUT_FILE_0}"
          mkdir -p "$(dirname "$plist")"
          rm -f "$plist"
          /usr/libexec/PlistBuddy \
            -c "Add :Label string $label" \
            -c "Add :BundleProgram string Contents/Helpers/TinycastKeyboardHelper" \
            -c "Add :AssociatedBundleIdentifiers array" \
            -c "Add :AssociatedBundleIdentifiers:0 string $PRODUCT_BUNDLE_IDENTIFIER" \
            -c "Add :MachServices dict" \
            -c "Add :MachServices:$label bool true" \
            -c "Add :ProcessType string Interactive" \
            "$plist"
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(PRODUCT_BUNDLE_IDENTIFIER).keyboard-helper.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TINYCAST_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Tinycast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tinycast/Tinycast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: tinycast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, like beta/stable in release.yml: a distinct bundle id means a
        # locally-run build gets its own prefs, caches, TCC grants and login item instead of
        # inheriting — and corrupting — the installed app's state.
        Debug:
          PRODUCT_NAME: Tinycast Dev

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Tinycast/Features/Clipboard/Service/ClipboardTextHelper.swift
    settings:
      base:
        # release.yml passes PRODUCT_NAME on the xcodebuild line, which hits every target: without
        # these two pinned, a channel build renames the executable `ClipboardTextWorker` looks for
        # and gives the module a name with a space in it.
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES

  TinycastKeyboardHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/KeyRemap/Model
      - Tinycast/Features/KeyRemap/Helper
    settings:
      base:
        # Pinned for the same release.yml PRODUCT_NAME reason as ClipboardTextHelper; the signing
        # identifier is the daemon's label, which is what the app's XPC peer check matches.
        EXECUTABLE_NAME: TinycastKeyboardHelper
        PRODUCT_MODULE_NAME: TinycastKeyboardHelper
        PRODUCT_BUNDLE_IDENTIFIER: "$(TINYCAST_BUNDLE_IDENTIFIER).keyboard-helper"
        # A bare tool signs under its file name; an embedded Info.plist makes the bundle id stick.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
